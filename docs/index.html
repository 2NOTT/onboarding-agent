  policies: [
    { policy_id:"P001", name:"员工手册", type:"handbook", version:"v2.3", effective_date:"2026-01-01", status:"active", scope:"全体员工", keywords:["手册","入职","文化","组织"], summary:"公司概况、组织架构、办公规范与员工权利义务总纲。", content:"本手册适用于全体员工。工作时间实行标准工时制，每日8小时、每周40小时。办公规范：保持工位整洁、会议室用后恢复、访客需前台登记。员工权利：享有法定假期、内部晋升通道与培训资源。义务：遵守保密与信息安全制度，离职时完成资产归还与权限交接。" },
    { policy_id:"P002", name:"考勤管理制度", type:"attendance", version:"v2.0", effective_date:"2025-06-01", status:"deprecated", scope:"全体员工", keywords:["考勤","打卡","迟到","补卡"], summary:"（已被 v2.1 替代）旧版考勤制度，演示版本冲突检索场景。", content:"迟到30分钟以内扣款50元，每月可免责补卡3次。该版本已于2026-03-01被 v2.1 替代，仅作历史版本保留。" },

function downloadJson(filename, value) {
  const url = URL.createObjectURL(new Blob([JSON.stringify(value, null, 2)], { type: "application/json;charset=utf-8" }));
  const link = document.createElement("a");
  link.href = url; link.download = filename;
  document.body.appendChild(link); link.click(); link.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
}

/* ============ 3. 通用工具函数 ============ */
const STAGE_ORDER = { day_1: 0, week_1: 1, month_1: 2, probation: 3 };
const STAGE_LABEL = { day_1: "入职第1天", week_1: "入职第1周", month_1: "入职第1个月", probation: "试用期" };
function findEmployee(id) { return DB.employees.find(e => e.employee_id === id) || null; }
function completedSet(emp) { return new Set(emp.completed_tasks || []); }
function taskApplicable(task, emp) {
  const dep = task.applicable.departments || [], pos = task.applicable.positions || [];
  if (dep.length && !dep.includes(emp.department)) return false;
  if (pos.length && !pos.includes(emp.position)) return false;
  return true;
}
function applicableTasks(emp, includeLater) {
  const reached = STAGE_ORDER[emp.onboarding_stage] ?? 0;
  return DB.tasks.filter(t => taskApplicable(t, emp) && (includeLater || (STAGE_ORDER[t.stage] ?? 0) <= reached));
}
function maskName(name) { return name ? name[0] + "**" : "**"; }
function fmtDate(s) { const d = new Date(s); return isNaN(d) ? s : d.toISOString().slice(0, 10); }
function todayStr() { const d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
function daysBetween(a, b) { return Math.floor((new Date(b) - new Date(a)) / 86400000); }
function hasAny(text, words) { return words.some(w => text.includes(w)); }

/* ============ 4. Tool 实现（事实查询全部由代码完成） ============ */
const TOOL_IMPLS = {
  query_employee_info(params, ctx) {
    const target = (params.employee_id && params.employee_id !== ctx.current_employee_id)
      ? findEmployee(params.employee_id) : ctx.employee;
    if (!target) return { error: "未找到该员工。" };
    // 隐私保护：不允许跨员工查询详细信息，仅返回脱敏公开信息
    if (target.employee_id !== ctx.current_employee_id) {
      return {
        denied: true, reason: "出于隐私保护，当前系统不允许查询其他员工的详细信息。",
        public_info: { name: maskName(target.name), department: target.department, position: target.position },
        message: "如需了解该同事的工作安排，建议直接与其本人或其部门负责人沟通。"
      };
    }
    const e = target;
    return {
      employee_id: e.employee_id, name: e.name, department: e.department, position: e.position,
      hire_date: e.hire_date, onboarding_stage: e.onboarding_stage, stage_label: STAGE_LABEL[e.onboarding_stage],
      manager: e.manager, hr_contact: e.hr_contact, email: e.email, phone: e.phone,
      account_status: e.account_status, device_status: e.device_status, access_status: e.access_status,
      completed_tasks: e.completed_tasks, pending_tasks: e.pending_tasks
    };
  },
  query_onboarding_tasks(params, ctx) {
    const emp = ctx.employee;
    let list = applicableTasks(emp, params.include_later_stage === true);
    if (params.stage && STAGE_ORDER[params.stage] !== undefined) list = list.filter(t => t.stage === params.stage);
    if (params.keyword) list = list.filter(t => (t.task_name + t.description).includes(params.keyword));
    if (params.task_id) list = list.filter(t => t.task_id === params.task_id);
    const done = completedSet(emp);
    return {
      count: list.length,
      tasks: list.map(t => ({
        task_id: t.task_id, task_name: t.task_name, category: t.category, stage: t.stage,
        priority: t.priority, required: t.required, recommended_time: t.recommended_time,
        deadline_days: t.deadline_days, dependency_tasks: t.dependency_tasks, owner: t.owner,
        description: t.description, completed: done.has(t.task_id)
      }))
    };
  },
  query_contacts(params, ctx) {
    const emp = ctx.employee;
    let list = DB.contacts.filter(c =>
      (c.available_departments || []).length === 0 || c.available_departments.includes(emp.department));
    if (params.role) list = list.filter(c => c.role === params.role);
    if (params.keyword) list = list.filter(c => (c.name + c.title).includes(params.keyword));
    return { count: list.length, contacts: list.map(c => ({ name: c.name, title: c.title, role: c.role, email: c.email, phone: c.phone })) };
  },
  query_policies(params, ctx) {
    let list = DB.policies.filter(p => params.include_deprecated ? true : p.status === "active");
    if (params.policy_type) list = list.filter(p => p.type === params.policy_type);
    if (params.keyword) list = list.filter(p => (p.name + p.keywords.join("") + p.summary + p.content).includes(params.keyword));
    if (params.version) list = list.filter(p => p.version === params.version);
    // 生效版本优先，同类型多版本时最新生效在前
    list = list.slice().sort((a, b) => (a.status === b.status ? 0 : (a.status === "active" ? -1 : 1)));
    return {
      count: list.length,

  const add = (name, type, target, purpose, inp, deps) => { n += 1; steps.push({ step_id: "S" + n, name, type, target, purpose, input: inp, depends_on: deps }); return steps[steps.length - 1].step_id; };
  // 跨员工检测：问题中出现其他员工编号或姓名 → 传给员工查询 Tool 做隐私拦截
  let otherRef = "";
  const m = question.match(/E\d{3}/);
  if (m && m[0] !== employee.employee_id) otherRef = m[0];
  else { const hit = DB.employees.find(e => e.name && e.name !== employee.name && question.includes(e.name)); if (hit) otherRef = hit.employee_id; }
  const s1 = add("问题结构化", "skill", "question_structuring", "将用户问题解析为结构化意图，指导后续查询。", {}, []);
  const s2 = add("查询员工信息", "tool", "query_employee_info", "获取员工身份、部门、岗位、入职阶段与账号设备状态。", otherRef ? { employee_id: otherRef } : {}, [s1]);
  const taskSteps = [];
  if (needs.tasks) {
    const s3 = add("查询入职任务", "tool", "query_onboarding_tasks", "获取适用于该员工的入职任务清单与完成状态。", {}, [s2]);
    const s4 = add("计算任务状态", "tool", "calc_task_status", "以代码计算完成率、逾期与阻塞情况，得出优先级排序。", {}, [s3]);
    taskSteps.push(s3, s4);
  }
  if (needs.policy) {
    const inp = {};
    for (const [kw, t] of POLICY_TYPE_MAP) { if (question.includes(kw)) { inp.policy_type = t; inp.keyword = kw; break; } }
    add("查询制度知识库", "tool", "query_policies", "检索与问题相关的公司制度原文与版本。", inp, [s2]);
  }
  if (needs.training) add("查询培训计划", "tool", "query_trainings", "获取适用于该员工的培训安排与完成状态。", {}, [s2]);
  if (needs.contacts) {
    const inp = {};
    for (const [kw, r] of CONTACT_ROLE_MAP) { if (question.toLowerCase().includes(kw.toLowerCase())) { inp.role = r; break; } }
    add("查询公司联系人", "tool", "query_contacts", "获取可对接的负责人及企业联系方式。", inp, [s2]);
  }
  if (needs.coze) add("调用 Coze 工作流", "tool", "run_coze_workflow", "将用户问题转发给 Coze 工作流，获取 answer / status / risk_level。", { user_input: question }, [s2]);
  let policyStep = "", contactStep = "";
  steps.forEach(s => { if (s.target === "query_policies") policyStep = s.step_id; if (s.target === "query_contacts") contactStep = s.step_id; });
  if (needs.tasks) add("入职任务决策", "skill", "task_decision", "基于任务数据判断当前应优先完成的事项。", {}, [s2].concat(taskSteps));
  if (needs.policy) add("制度与知识问答", "skill", "policy_qa", "基于检索到的制度原文生成带版本标注的解释。", {}, [s2, policyStep]);
  if (needs.process) add("入职流程解释", "skill", "process_explainer", "生成面向新员工的步骤化流程说明。", {}, [s2].concat(taskSteps, contactStep ? [contactStep] : []));
  const commDeps = steps.map(s => s.step_id);
  add("生成沟通话术", "skill", "communication", "汇总所有查询与技能结果，生成面向员工的最终回复。", {}, commDeps);
  add("合规与风险审核", "skill", "compliance_check", "审核最终回复的合规与风险，通过后才允许返回。", {}, [steps[steps.length - 1].step_id]);
  return { plan_summary: "针对「" + question.slice(0, 30) + "」的结构化问答计划：先结构化问题，再查询相关数据，最后生成回复并完成合规审核。", steps };
}
function validatePlan(plan, warnings) {
  // 剔除已禁用 / 不存在的能力步骤，修正依赖并重编号
  const valid = [];
  (plan.steps || []).forEach(s => {
    if (s.type === "tool") {
      if (!TOOL_IMPLS[s.target]) { warnings.push("Planner 生成了系统中不存在的 Tool「" + s.target + "」，已剔除。"); return; }
      if (!toolRegistry.isEnabled(s.target)) { warnings.push("Tool「" + s.target + "」已被禁用，已从计划中剔除。"); return; }
    } else if (s.type === "skill") {
      const cfg = skillRegistry.getByType(s.target);
      if (!cfg) { warnings.push("Planner 生成了系统中不存在的 Skill「" + s.target + "」，已剔除。"); return; }
      if (cfg.enabled === false) { warnings.push("Skill「" + s.target + "」已被禁用，已从计划中剔除。"); return; }
    } else { warnings.push("计划步骤类型非法，已剔除。"); return; }
    valid.push(s);
  });
  // 强制末尾：communication（依赖全部前置步骤）→ compliance_check
  const commIdx = valid.findIndex(s => s.target === "communication");
  if (commIdx >= 0) valid.splice(commIdx, 1);
  const compIdx = valid.findIndex(s => s.target === "compliance_check");
  if (compIdx >= 0) valid.splice(compIdx, 1);
  const commCfg = skillRegistry.getByType("communication");
  const compCfg = skillRegistry.getByType("compliance_check");
  if (commCfg && commCfg.enabled !== false) {
    valid.push({ step_id: "__comm", name: "生成沟通话术", type: "skill", target: "communication", purpose: "汇总所有查询与技能结果，生成面向员工的最终回复。", input: {}, depends_on: valid.map(s => s.step_id) });
  } else warnings.push("Skill「communication」不可用，无法生成最终回复。");
  if (compCfg && compCfg.enabled !== false) {
    valid.push({ step_id: "__comp", name: "合规与风险审核", type: "skill", target: "compliance_check", purpose: "审核最终回复的合规与风险，通过后才允许返回。", input: {}, depends_on: ["__comm"] });
  } else warnings.push("Skill「compliance_check」不可用，最终回复将缺少风控审核。");
  // 重编号 + 依赖映射
  const idMap = {}; valid.forEach((s, i) => { idMap[s.step_id] = "S" + (i + 1); });
  valid.forEach((s, i) => {
    s.step_id = "S" + (i + 1);
    s.depends_on = (s.depends_on || []).map(d => idMap[d]).filter(d => valid.some(v => v.step_id === d));
  });
  return { plan_summary: plan.plan_summary, steps: valid };
}

/* ============ 7. Executor + 风控闭环 ============ */
const SAFE_FALLBACK = "抱歉，该回复未能通过合规与风险审核，暂不提供。请稍后重试，或直接联系你的 HR 对接人确认。";
const EMPLOYEE_KEYS = ["employee_id", "name", "department", "position", "hire_date", "onboarding_stage", "manager", "hr_contact", "email", "phone", "account_status", "device_status", "access_status"];
function empSummary(e) { const o = {}; EMPLOYEE_KEYS.forEach(k => { o[k] = e ? e[k] : undefined; }); o.stage_label = e ? STAGE_LABEL[e.onboarding_stage] : ""; return o; }
function newLogId() {
  const d = new Date(), p = n => String(n).padStart(2, "0");
  return "LOG-" + d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds()) + "-" + Math.random().toString(16).slice(2, 8);
}
function execute(employeeId, question) {
  const t0 = performance.now();
  const employee = findEmployee(employeeId);
  if (!employee) return { error: "未找到员工 " + employeeId };
  const warnings = [], errors = [], steps = [];
  // 可用能力快照（仅已启用项）
  const enabledSkills = skills.filter(s => s.enabled !== false).map(s => ({ skill_id: s.skill_id, type: s.type, name: s.name, description: s.description }));
  const enabledTools = tools.filter(t => t.enabled !== false);
  let plan = validatePlan(mockPlan(question, employee), warnings);
  // 执行（计划本身已按依赖顺序排好）
  const outputsByStep = {};
  plan.steps.forEach(step => {
    const entry = { step_id: step.step_id, name: step.name, type: step.type, target: step.target, purpose: step.purpose, depends_on: step.depends_on, input: null, output: null, status: "pending", engine: null, elapsed_ms: null, error: null };
    const ts = performance.now();
    if (step.type === "tool") {
      if (!toolRegistry.isEnabled(step.target)) {
        entry.status = "skipped"; entry.error = "Tool「" + step.target + "」已被禁用，Executor 拒绝执行。"; errors.push(entry.error);
      } else {
        entry.input = step.input;
        const out = toolRegistry.execute(step.target, step.input, { current_employee_id: employeeId, employee, question });
        entry.output = out; entry.status = "success"; entry.engine = "code";
      }
    } else {
      const cfg = skillRegistry.getByType(step.target);
      if (!cfg || cfg.enabled === false) {
        entry.status = "skipped"; entry.error = "Skill「" + (cfg ? cfg.name : step.target) + "」已被禁用，Executor 拒绝执行。"; errors.push(entry.error);
      } else {
        const skillInput = { question, employee: empSummary(employee), params: Object.assign({}, step.input) };
        step.depends_on.forEach(d => {
          const dep = plan.steps.find(s => s.step_id === d);
          if (dep) skillInput[dep.target] = outputsByStep[d] !== undefined ? outputsByStep[d] : null;
        });
        if (step.target === "compliance_check") {
          skillInput.draft_reply = skillInput.communication ? skillInput.communication.reply || "" : "";
        }
        entry.input = skillInput;
        const out = skillRegistry.run(step.target, skillInput, { employee: skillInput.employee });
        entry.output = out; entry.status = "success"; entry.engine = "rule";
      }
    }
    entry.elapsed_ms = Math.round((performance.now() - ts) * 10) / 10;
    outputsByStep[step.step_id] = entry.output;
    steps.push(entry);
  });
  // 风控闭环：不通过 → 携带审核意见重生成（最多2轮）→ 仍失败返回安全兜底
  const commStep = steps.find(s => s.target === "communication");
  const compStep = steps.find(s => s.target === "compliance_check");
  let finalReply = "", riskResult = null;
  if (commStep && compStep && commStep.output) {
    let draft = commStep.output.reply || "";
    let comp = compStep.output;
    if (!comp) {
      warnings.push("合规审核 Skill 未执行，最终回复未经过风控，已返回安全兜底话术。");
      comp = { risk_level: "high", passed: false, issues: ["合规审核 Skill 未执行，回复未经过风控。"], suggestions: [], final_reply: "" };
    }
    let round = 0;
    while (comp && comp.passed === false && round < 2) {
      round += 1;
      warnings.push("合规审核未通过，已根据审核意见自动重新生成回复（第" + round + "轮）。");
      const revInput = Object.assign({}, commStep.input, { revision_instructions: (comp.issues || []).concat(comp.suggestions || []), previous_reply: draft });
      const revOut = skillRegistry.run("communication", revInput, { employee: commStep.input.employee });
      draft = revOut.reply || draft;
      const compInput = Object.assign({}, compStep.input, { draft_reply: draft });
      comp = skillRegistry.run("compliance_check", compInput, { employee: compStep.input.employee });
      steps.push({ step_id: "R" + round + "-1", name: "回复修订（第" + round + "轮）", type: "skill", target: "communication", purpose: "根据合规审核意见修订回复。", depends_on: [compStep.step_id], input: revInput, output: revOut, status: "success", engine: "rule", elapsed_ms: 0, error: null });
      steps.push({ step_id: "R" + round + "-2", name: "合规复审（第" + round + "轮）", type: "skill", target: "compliance_check", purpose: "对修订后的回复再次审核。", depends_on: ["R" + round + "-1"], input: compInput, output: comp, status: "success", engine: "rule", elapsed_ms: 0, error: null });
    }
    riskResult = comp;
    finalReply = comp.passed ? (comp.final_reply || draft) : SAFE_FALLBACK;
    if (!comp.passed) warnings.push("多轮修订仍未通过风控，已返回安全兜底话术。");
  } else {
    riskResult = { risk_level: "high", passed: false, issues: ["缺少合规审核 Skill，回复未经过风控。"], suggestions: [], final_reply: "" };
    finalReply = SAFE_FALLBACK; errors.push("最终回复缺少话术或风控步骤，已返回安全兜底。");
  }
  const result = {
    log_id: newLogId(),
    created_at: (d => d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0") + " " + String(d.getHours()).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0") + ":" + String(d.getSeconds()).padStart(2, "0"))(new Date()),
    employee_id: employeeId, employee: empSummary(employee), question,
    mock_mode: true,
    available_skills: enabledSkills,
    available_tools: enabledTools.map(t => ({ name: t.name, display_name: t.display_name, description: t.description })),
    plan, planner_engine: "rule", steps,
    final_reply: finalReply, risk_result: riskResult,
    warnings, errors, duration_ms: Math.round((performance.now() - t0) * 10) / 10
  };
  const logs = getLogs(); logs.push(result); saveLogs(logs);
  return result;
}

function setNav(active) { document.querySelectorAll("#nav a").forEach(a => a.classList.toggle("active", a.dataset.nav === active)); }
function route() {
  const parts = (location.hash.replace(/^#/, "") || "/").split("/").filter(Boolean);
  window.scrollTo({ top: 0, left: 0, behavior: "instant" });
  $view.classList.remove("page-enter"); void $view.offsetWidth; $view.classList.add("page-enter");
  try {
    if (parts.length === 0) { setNav("agent"); pageAgent(); }
    else if (parts[0] === "skills" && parts.length === 1) { setNav("skills"); pageSkills(); }
    else if (parts[0] === "skills" && parts[2] === "edit") { setNav("skills"); pageSkillEdit(parts[1]); }
    else if (parts[0] === "skills" && parts[2] === "test") { setNav("skills"); pageSkillTest(parts[1]); }
    else if (parts[0] === "tools" && parts.length === 1) { setNav("tools"); pageTools(); }
    else if (parts[0] === "logs" && parts.length === 1) { setNav("logs"); pageLogs(); }
    else if (parts[0] === "logs" && parts.length === 2) { setNav("logs"); pageLogDetail(parts[1]); }
    else { setNav(""); $view.innerHTML = "<div class=\"card\"><h3>404 · 页面不存在</h3><p style=\"color:var(--text-dim)\">请从左侧导航选择页面，或 <a href=\"#/\">返回 Agent 执行台</a>。</p></div>"; }
  } catch (e) {
    $view.innerHTML = "<div class=\"card\"><h3>页面加载失败</h3><div class=\"step-error\">" + esc(e.message || e) + "</div></div>";
  }
}
window.addEventListener("hashchange", route);
route();
</script>
</body>
</html>
